server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: jsp2thymeleaf-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

jsp2thymeleaf:
  service:
    output-directory: ${java.io.tmpdir}/jsp2thymeleaf/output
    concurrent-conversions: 5
    validation:
      enabled: true
    cleanup:
      enabled: true
      after-hours: 24
    logging:
      enabled: true
      level: INFO
